name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reconcileflow_test
          POSTGRES_USER: reconcileflow
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconcileflow -d reconcileflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECONCILEFLOW_DATABASE_URL: postgresql+psycopg://reconcileflow:integration-test-only@localhost:5432/reconcileflow_test
      RECONCILEFLOW_TEST_POSTGRESQL_URL: postgresql+psycopg://reconcileflow:integration-test-only@localhost:5432/reconcileflow_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install --editable ".[dev]"
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run all tests
        run: python -m pytest

  container:
    name: Validate container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker compose build api
