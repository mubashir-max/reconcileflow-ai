name: reconcileflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - object_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    environment:
      RECONCILEFLOW_UPLOAD_DIRECTORY: /app/var/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploaded_files:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "reconcileflow.worker"]
    env_file:
      - path: .env.docker.example
      - path: .env.docker
        required: false
    environment:
      RECONCILEFLOW_RUN_MIGRATIONS: "false"
      RECONCILEFLOW_UPLOAD_DIRECTORY: /app/var/uploads
    volumes:
      - uploaded_files:/app/var/uploads
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "reconcileflow.worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  uploaded_files:
  object_storage:
