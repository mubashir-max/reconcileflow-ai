[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reconcileflow-ai"
version = "0.2.0"
description = "AI-powered financial reconciliation SaaS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "openpyxl>=3.1",
    "pydantic-settings>=2.10",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.35",
]

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
markers = [
    "postgresql: requires a PostgreSQL database configured for integration testing",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
]
